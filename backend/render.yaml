services:
  - type: web
    name: district-slide-tool-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # You'll paste this in the Render dashboard
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
